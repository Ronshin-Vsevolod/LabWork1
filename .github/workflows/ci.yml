name: CI

on:
  push:
    branches: [ main, parallel_implementation ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libomp-dev
    
    - name: Build
      run: make
    
    - name: Run tests
      run: make test 